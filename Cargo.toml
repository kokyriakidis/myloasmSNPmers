[package]
name = "myloasm"
version = "0.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"
#build = "build.rs"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "myloasm"
# rlib: consumed by the myloasm binary; staticlib: linked into the hifiasm
# fork via the C ABI in src/ffi.rs.
crate-type = ["rlib", "staticlib"]
path = "src/lib.rs"

[dependencies]
needletail = {version = "0.6.3", features = ["bzip2", "flate2"], default-features = false}
#simple_logger=  { version = "3", features = ["stderr"] }
flexi_logger = {version = "0.29", features = ["colors"] }
log = "0"
rayon = "1"
smallvec = { version = "1", features = ["union","serde","write"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
clap = { version = "4.4", features = ["derive"] }
#rust-htslib= { version = "0.46", default-features = false }
statrs = "0.16"
spmc = "0.3"
fishers_exact = "1.0"
fxhash = "0"
#bio-seq = { version = "0.14", features = ["serde"]}
bio-seq = { git = "https://github.com/bluenote-1577/bio-seq.git", features = ["serde"]}
rust-lapper = { version = "1.1", features = ["with_serde"]}
memory-stats = "1.2.0"
fastbloom = "0.17.0"
crossbeam-channel = "0.5.13"
tikv-jemallocator = "0.4.0"
sysinfo = "0.34.2"
block-aligner = { version = "0.5" }
clap-markdown = { git = "https://github.com/bluenote-1577/clap-markdown.git" }
minimum_redundancy = "0.3.3"
# Removed in the SNPmer-only fork (downstream-only deps): rust-spoa, abpoa,
# skani, gzp, flate2, rand, ordered-float, wide, built, clap-num, boomphf.

[features]
default = ["avx2"]
avx2 = ["block-aligner/simd_avx2"]
neon = ["block-aligner/simd_neon"]
sse = ["block-aligner/simd_sse2"]

[target.'cfg(target_arch = "aarch64")'.features]
default = ["neon"]

#crossbeam-utils = "*"

[dev-dependencies]
assert_cmd = "1.0.1"
tempfile = "3.8"
#predicates = "1"
#serial_test = "*"
#rand = "0.8"
approx = "0.4"


[profile.release]
#panic = "abort"
#lto = true

[profile.dev]
#opt-level = 1
opt-level = 3

[[bin]]
name = "myloasm" # The desired binary name
path = "src/main.rs"
